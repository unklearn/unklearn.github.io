<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta
      name="description"
      content="Learn how AI agents work through small, interactive experiments."
    />
    <title>Unklearn — Interactive labs for AI agents</title>
    <link rel="icon" type="image/svg+xml" href="/unklearn.svg" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="site-brand" href="./">
          <img src="/unklearn.svg" alt="" width="36" height="36" />
          <span>unklearn</span>
        </a>
        <nav aria-label="Main navigation">
          <a class="index-link" href="#labs"
            >Lab index <span aria-hidden="true">↓</span></a
          >
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="home-title">
          <div class="hero-copy">
            <p class="eyebrow">Interactive labs for AI agents</p>
            <h1 id="home-title">Open the <em>black box.</em></h1>
            <p class="intro">
              Learn how AI agents work through small experiments. Change what an
              agent knows or what it can do, then see what happens.
            </p>
            <a class="hero-action" href="#labs">
              Explore the labs <span aria-hidden="true">↓</span>
            </a>
          </div>
          <figure class="hero-figure">
            <img src="/art/agent-loop.svg" alt="" width="640" height="430" />
            <figcaption>
              <span>Fig. 01</span>
              <span
                >Observe <b aria-hidden="true">→</b> Decide
                <b aria-hidden="true">→</b> Act</span
              >
            </figcaption>
          </figure>
        </section>

        <section class="lab-index" id="labs" aria-labelledby="labs-heading">
          <header class="section-heading">
            <p class="eyebrow">The index</p>
            <h2 id="labs-heading">Labs</h2>
          </header>
          <ul class="lab-list" role="list">
            <!-- lab-list -->
          </ul>
        </section>
      </main>

      <footer class="site-footer">Unklearn</footer>
    </div>
  </body>
</html>
